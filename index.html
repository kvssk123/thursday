const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search);
const PREVIEW=qs.get('k')===C.previewKey&&qs.has('w');
const ALT=["38,000 ft","36,000 ft","30,000 ft","22,000 ft","14,000 ft","2,000 ft","on the ground"];
const PAL={
  night:"linear-gradient(180deg,#0e1633 0%,#232a55 45%,#5b4a78 72%,#c07d86 92%,#e7a58e 100%)",
  dawn:"linear-gradient(180deg,#1d2752 0%,#45508a 34%,#9a86b0 58%,#e7a7a0 78%,#f8cf9a 100%)",
  morning:"linear-gradient(180deg,#5d86c4 0%,#93b4e0 40%,#d9d6e8 75%,#f7e2cf 100%)",
  day:"linear-gradient(180deg,#3f78c2 0%,#78a7dc 38%,#b9d3ee 72%,#e6eef6 100%)",
  golden:"linear-gradient(180deg,#56669e 0%,#9a8fb5 30%,#e0a59c 58%,#f6be8a 80%,#ffdca6 100%)",
  blue:"linear-gradient(180deg,#121a3f 0%,#2b3a72 40%,#6b6c9f 70%,#c48d8e 92%,#e2a58f 100%)"};
const PH={ // stars, moon, sun[left,top,color], cloud color/opacity, sea, wing brightness, ground colors, lights
  night:{so:1,moon:1,sun:null,cl:["#cbbfd8",.3],sea:.1,wing:.45,gd:["#191a33","#0d0d1c"],lights:1},
  blue:{so:.6,moon:.9,sun:null,cl:["#b9aac8",.35],sea:.15,wing:.55,gd:["#252546","#121226"],lights:1},
  dawn:{so:.3,moon:.6,sun:["24%","96%","rgba(255,214,170,.9)"],cl:["#f2c9c6",.55],sea:.6,wing:.7,gd:["#4b4766","#2b2a44"],lights:.6},
  morning:{so:0,moon:0,sun:["26%","40%","rgba(255,250,232,1)"],cl:["#ffffff",.8],sea:.9,wing:.95,gd:["#8fa3b3","#6f8394"],lights:0},
  day:{so:0,moon:0,sun:["24%","18%","rgba(255,255,245,1)"],cl:["#ffffff",.9],sea:.95,wing:1,gd:["#8ea6b8","#6f8a9a"],lights:0},
  golden:{so:0,moon:0,sun:["20%","66%","rgba(255,236,200,1)"],cl:["#ffe6d2",.85],sea:.85,wing:.85,gd:["#b68f86","#7a6170"],lights:.15}};
const SEA=[.95,.85,.55,.3,.12,0,0], GH=[0,0,13,20,28,36,40];

function nowWin(){
  if(PREVIEW){const n=+qs.get('w');return S.windows[Math.max(0,Math.min(S.windows.length-1,n))]}
  const t=Date.now();let cur=S.windows[0];for(const w of S.windows)if(Date.parse(w.at)<=t)cur=w;return cur}
let rnd;function seed(n){let s=n*9301+49297;rnd=()=>(s=(s*9301+49297)%233280)/233280}

function fill(){document.querySelectorAll('[data-c]').forEach(e=>e.textContent=C[e.dataset.c]??'')}
function scene(w){
  const p=PH[w.phase],g=$('#glass');seed(w.id+1);
  $('#skyfill').style.background=PAL[w.phase];g.style.setProperty('--so',p.so);
  $('#moon').style.opacity=p.moon;
  const sun=$('#sun');if(p.sun){sun.style.opacity=1;sun.style.left=p.sun[0];sun.style.top=p.sun[1];sun.style.background=`radial-gradient(circle,${p.sun[2]} 0 13%,rgba(255,226,190,.55) 30%,rgba(255,210,170,0) 70%)`}else sun.style.opacity=0;
  // clouds
  const cl=$('#clouds');cl.innerHTML='';
  [[12,90,30,38,'b'],[30,70,22,26,''],[48,110,34,46,'b'],[22,60,18,22,''],[58,80,26,34,''],[40,130,40,55,'b']].forEach(([top,ww,h,dur,cls])=>{
    const c=document.createElement('div');c.className='cloud '+cls;c.style.top=top+'%';c.style.width=ww+'px';c.style.height=h+'px';c.style.background=p.cl[0];c.style.opacity=p.cl[1]*(cls?.7:1)*(w.alt>=5?.4:1);
    c.style.setProperty('--from','260px');c.style.setProperty('--to','-180px');c.style.animationDuration=dur+'s';c.style.animationDelay=(-rnd()*dur)+'s';cl.appendChild(c)});
  // cloud floor
  const sea=$('#sea'),light=['day','morning','golden'].includes(w.phase);
  sea.style.background=`radial-gradient(ellipse at 30% 0,${light?'#fff':'#d9cfe6'} 0 30%,transparent 60%),radial-gradient(ellipse at 75% 10%,${light?'#fff':'#d9cfe6'} 0 25%,transparent 60%),linear-gradient(${w.phase==='golden'?'#fff1e6,#ffe0cc':light?'#ffffff,#eef2f7':'#cfc3dc,#a99cc0'})`;
  sea.style.opacity=SEA[w.alt]*(light?1:p.sea*4>1?1:p.sea*4);
  // ground
  const gr=$('#ground');gr.innerHTML='';gr.style.height=GH[w.alt]+'%';gr.style.background=`linear-gradient(180deg,${p.gd[0]},${p.gd[1]})`;
  gr.style.maskImage=gr.style.webkitMaskImage='linear-gradient(180deg,transparent,#000 35%)';
  if(GH[w.alt]){
    if(p.lights<.5){ // daytime fields
      for(let i=0;i<14;i++){const f=document.createElement('div');f.className='fld';const s=8+rnd()*26*(1+w.alt*.15);f.style.width=s+'px';f.style.height=s*(.5+rnd()*.6)+'px';f.style.left=rnd()*100+'%';f.style.top=20+rnd()*75+'%';f.style.background=['rgba(150,170,120,.35)','rgba(190,175,130,.3)','rgba(120,140,110,.35)','rgba(210,200,180,.3)'][i%4];f.style.transform=`rotate(${(rnd()*30-15).toFixed(1)}deg)`;gr.appendChild(f)}
    }
    const nL=[0,0,30,50,80,110,70][w.alt]*Math.max(p.lights,.0),sz=[0,0,1,1.2,1.6,2.1,2][w.alt];
    for(let i=0;i<nL;i++){const d=document.createElement('div');d.className='lt';const y=rnd();d.style.left=rnd()*100+'%';d.style.top=(30+y*y*68)+'%';const z=(1+rnd()*1.6)*sz;d.style.width=d.style.height=z+'px';
      const col=['#ffd38a','#ffb36b','#fff1c9','#ff9a8a'][i%4];d.style.background=col;d.style.boxShadow=`0 0 ${3+z*2}px ${col}`;d.style.setProperty('--o',(.5+rnd()*.5).toFixed(2));d.style.opacity=p.lights;d.style.animationDelay=(-rnd()*3)+'s';gr.appendChild(d)}
    if(w.alt>=3&&w.alt<6){for(let i=0;i<3;i++){const h=document.createElement('div');h.className='hw';h.style.left=(rnd()*60)+'%';h.style.top=(35+rnd()*55)+'%';h.style.width=(40+rnd()*60)+'%';h.style.transform=`rotate(${(rnd()*24-12).toFixed(1)}deg)`;
      h.style.background=p.lights>.5?'linear-gradient(90deg,transparent,rgba(255,200,120,.85),rgba(255,230,180,.6),transparent)':'linear-gradient(90deg,transparent,rgba(90,95,110,.35),transparent)';if(p.lights>.5)h.style.boxShadow='0 0 6px rgba(255,190,110,.6)';gr.appendChild(h)}}
    if(w.alt===6){for(let i=0;i<9;i++){const k=i/8;[[-1],[1]].forEach(([sgn])=>{const r=document.createElement('div');r.className='rw';r.style.left=`calc(50% + ${sgn*(4+k*k*60)}%)`;r.style.top=(18+k*80)+'%';r.style.transform=`scale(${.5+k*1.4})`;gr.appendChild(r)})}}
  }
  const wing=$('#wing');wing.style.filter=`brightness(${p.wing})${w.phase==='golden'?' sepia(.25)':''}`;wing.classList.toggle('parked',w.alt===6);
  // text & pass
  $('#sky').style.setProperty('--ts',['day','morning','golden'].includes(w.phase)?'0 1px 3px rgba(30,40,80,.55),0 2px 22px rgba(30,40,90,.55)':'');$('#kicker').textContent=w.kicker;$('#l1').textContent=w.l1;$('#l2').textContent=w.l2;$('#alti').textContent=ALT[w.alt];
  $('#status').textContent=w.status;$('#stamp').textContent=w.stamp||C.stamp;
  const cta=$('#cta');cta.textContent=w.cta||C.checkedIn;cta.classList.toggle('done',!w.cta);
  $('#mid').style.setProperty('--prog',Math.min(100,8+w.id*8.4)+'%');
  for(let i=1;i<=5;i++)$('#mk'+i).classList.toggle('on',w.marks>=i);
  $('#pass').classList.toggle('torn',w.marks>=6);
  $('#cal').style.display=w.after?'none':'';
}

/* chime */
let AC;function chime(n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;n.forEach(([f,dt])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+dt);g.gain.linearRampToValueAtTime(.1,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+1.6);o.connect(g).connect(AC.destination);o.start(t0+dt);o.stop(t0+dt+1.7)})}catch(_){}}

/* shade */
const shade=$('#shade');let y0=null,base=0,cur=0,opened=false,moved=false;const H=()=>shade.offsetHeight;
function setY(y){cur=y;shade.style.transform=`translateY(${y}px)`}
shade.addEventListener('pointerdown',e=>{if(opened)return;y0=e.clientY;base=cur;moved=false;shade.setPointerCapture(e.pointerId);shade.style.transition='none'});
shade.addEventListener('pointermove',e=>{if(y0==null||opened)return;const dy=e.clientY-y0;if(Math.abs(dy)>4)moved=true;setY(Math.min(0,Math.max(-H()+30,base+dy)))});
shade.addEventListener('pointerup',()=>{if(opened)return;y0=null;shade.style.transition='transform .6s cubic-bezier(.2,1,.3,1)';if(!moved||cur<-H()*.35)openShade();else setY(0)});
function fit(){const bz=$('.bezel');bz.style.transform='';const r=bz.getBoundingClientRect(),ph=$('#pass').offsetHeight+60,top=innerHeight-ph-18;const k=Math.min(1,(top-r.top-14)/r.height);bz.style.transform=k<1?`translateY(-${Math.min(r.top-14,24)}px) scale(${k.toFixed(3)})`:''}
function openShade(instant){opened=true;shade.style.transition=instant?'none':'transform 1.1s cubic-bezier(.2,1,.3,1)';setY(-H()+30);
  const T=instant?0:1;
  setTimeout(()=>{$('#sky').classList.add('on');$('#alti').classList.add('on')},700*T);
  if(!instant)setTimeout(()=>chime([[659.25,0],[523.25,.45]]),300);
  if(!instant&&['night','blue','dawn'].includes(W.phase))setTimeout(()=>$('#shoot').classList.add('go'),3800);
  setTimeout(()=>{const p=$('#pass');if(instant)p.classList.add('instant');p.classList.add('on');document.body.classList.add('passup');fit()},2600*T);
  if(!PREVIEW)try{localStorage.setItem('thu.v2.seen',String(W.id))}catch(_){}}

/* messages */
function sendMsg(t){const n=String(C.whatsapp||'').replace(/\D/g,'');t=encodeURIComponent(t);location.href=n?`https://wa.me/${n}?text=${t}`:`sms:${String(C.imessage||'').replace(/[^\d+]/g,'')}&body=${t}`}
$('#tell').onclick=()=>sendMsg(W.reply||C.replyText);
$('#cta').onclick=()=>{if(W.cta)sendMsg(W.reply||W.cta)};
$('#note').onclick=()=>{$('#sheet').classList.add('on');$('#ns').disabled=!$('#nt').value.trim();setTimeout(()=>$('#nt').focus(),350)};
$('#sx').onclick=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('on')};
$('#nt').oninput=()=>$('#ns').disabled=!$('#nt').value.trim();
$('#ns').onclick=()=>{const v=$('#nt').value.trim();if(v){$('#sheet').classList.remove('on');sendMsg(v)}};
$('#cal').onclick=()=>{const s=new Date(C.calStart),e=new Date(s.getTime()+(parseFloat(C.calHours)||3)*36e5),f=d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//windowseat//EN','BEGIN:VEVENT','UID:thu-1022@ws','DTSTAMP:'+f(new Date()),'DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+C.calTitle,'DESCRIPTION:pickup: '+C.gate,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='thursday.ics';a.click()};

/* stars (once) */
(function(){const s=$('#stars');seed(99);for(let i=0;i<55;i++){const d=document.createElement('div');d.className='star';d.style.left=rnd()*100+'%';d.style.top=rnd()*62+'%';const z=rnd();d.style.width=d.style.height=(z>.85?2.6:1.6)+'px';d.style.setProperty('--o',(.45+rnd()*.55).toFixed(2));d.style.setProperty('--d',(-rnd()*2.4)+'s');s.appendChild(d)}})();

let W=nowWin();fill();scene(W);
if(PREVIEW){const pv=$('#pv'),n=W.id,last=S.windows.length-1;pv.style.display='block';pv.innerHTML=`${n>0?`<a href="?w=${n-1}&k=${C.previewKey}">‹</a>`:''} preview · ${n+1}/${last+1} · ${W.kicker} ${n<last?`<a href="?w=${n+1}&k=${C.previewKey}">›</a>`:''}`}
$('#shade').style.display='none';$('#hint').style.display='none';
requestAnimationFrame(()=>{opened=true;setTimeout(()=>{$('#sky').classList.add('on');$('#alti').classList.add('on')},300);
  if(['night','blue','dawn'].includes(W.phase))setTimeout(()=>$('#shoot').classList.add('go'),2600);
  setTimeout(()=>{$('#pass').classList.add('on');document.body.classList.add('passup');fit()},1100)});
function recheck(){if(PREVIEW)return;const n=nowWin();if(n.id!==W.id)location.reload()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)recheck()});addEventListener('pageshow',recheck);setInterval(recheck,60000);
addEventListener('resize',()=>{if(opened)fit()});
</script>
